# OPS-001 — repository quality gates.
# Gates: migration-manifest verification, media validation, unit tests,
# typecheck, lint, production build, route validation, Playwright discovery
# and Playwright E2E, per docs/claude-code/VALIDATION-MATRIX.md.
name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow needs nothing beyond reading the repository. No secrets are
# read anywhere; pull_request runs execute against the merge ref with the
# default read-only token.
permissions:
  contents: read

# One live run per ref. In-progress PR runs are superseded by newer pushes;
# main keeps every run for a complete evidence history.
concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-manifest:
    name: Migration manifest integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify MIG-000 manifest against the migration commit
        run: node qa/verify-migration-manifest.mjs

  static-gates:
    name: Media, unit, typecheck and lint gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate media manifest
        run: pnpm validate:media

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  build-and-browser:
    name: Build, routes and browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      - name: Route validation
        run: pnpm test:routes

      - name: Playwright test discovery
        run: pnpm exec playwright test --list

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-traces
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
