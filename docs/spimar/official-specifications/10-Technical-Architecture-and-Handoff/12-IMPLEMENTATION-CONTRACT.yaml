  cto_source_requirements: 40
  prd_requirements: 276
  route_surface_ids: 50
  template_families: 17
  uxf_targets: 48
  hif_targets: 48
  controlled_states: 144
  component_responsibilities: 58
  prototype_contracts: 6
  motion_contracts: 24
  qa09_cases: 16
  q10_cases: 25
  engineering_tasks: 57

quality:
  homepage_client_js_gzip_kb_max: 170
  initial_mobile_transfer_mb_max_excluding_optional_video: 1.5
  mobile_hero_poster_kb_target: 250
  desktop_hero_poster_kb_target: 450
  production_font_families_max: 2
  core_web_vitals_p75:
    lcp_seconds_max: 2.5
    inp_ms_max: 200
    cls_max: 0.1

