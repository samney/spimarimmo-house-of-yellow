contract_id: SPM-TECH-CONTRACT-001
version: 1.1.0
date: 2026-07-31
status: gate_10_approved_read_only_intake_access_blocked
owner: Samney

product:
  release: 1
  primary_audience: exhibitor_decision_unit
  secondary_audience: visitor
  public_scope:
    - marketing
    - exhibitor_lead_generation
    - visitor_pre_registration
  excluded:
    - payment
    - contractual_stand_reservation
    - ticketing_and_check_in
    - private_customer_portal
    - public_search
    - user_accounts

architecture:
  application: one_host_aware_nextjs_typescript_application
  rendering: server_first_progressive_enhancement
  locales: [fr, en, ar]
  rtl: true
  hosts: [global, local_single_event, local_multi_event]
  content_boundary: typed_content_repository
  operational_truth: durable_relational_store
  integration_pattern: transactional_outbox_and_provider_adapters
  clone_strategy: repair_neutralize_merge_and_expand

repository_intake:
  repository: https://github.com/samney/spimarimmo-house-of-yellow
  branch: main
  deployment: https://spimarimmo-house-of-yellow.vercel.app/
  environment_contract: names_only_supplied
  repository_access: blocked_not_found_from_connected_github_workflow
  immutable_commit: unknown
  deployment_build_identity: unknown
  source_claims_verified: false

event_state:
  independent_axes:
    lifecycle:
      - draft
      - announced_undated
      - scheduled
      - live
      - completed
      - archived
      - postponed
      - cancelled
    exhibitor_sales: [planned, open, limited, sold_out, closed]
    visitor_registration: [planned, open, waitlist, full, closed]

conversion_truth:
  ordered_outcomes:
    - clicked
    - form_started
    - server_validated
    - durably_submitted
    - crm_synchronized
    - delivered
    - provider_booked
    - business_outcome
  success_boundary: durably_submitted
  booking_boundary: provider_booked

